<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Калькулятор на Flask</title>
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, sans-serif;

        }

        .calculator {
            background: #ffffff;
            padding: 30px 35px;
            border-radius: 15px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.25);
            width: 350px;
        }

        h1 {
            margin: 0 0 20px;
            font-size: 24px;
            text-align: center;
            color: #333;
        }

        label {
            display: block;
            font-size: 13px;
            color: #555;
            margin-bottom: 5px;
        }

        input, select {
            width: 100%;
            padding: 10px 12px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input:focus, select:focus {
            border-color: #667eea;
            box-shadow: 0 0 5px rgba(102, 126, 234, 0.4);
            outline: none;
        }

        button {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            color: #fff;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.1s, opacity 0.2s;
        }

        button:hover { opacity: 0.9; }
        button:active { transform: scale(0.98); }

        .result {
            margin-top: 20px;
            padding: 15px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            color: #333;
            background: #f0f2ff;
            border-radius: 8px;
            border-left: 5px solid #667eea;
            word-break: break-word;
        }
    </style>
</head>
<body>
    <div class="calculator">
        <h1>Калькулятор</h1>
        <form method="post">
            <label for="num1">Первое число</label>
            <input type="text" id="num1" name="num1" value="{{ num1 }}" placeholder="Например, 5" required>

            <label for="operation">Операция</label>
            <select id="operation" name="operation">
                <option value="add" {% if operation == 'add' %}selected{% endif %}>Сложение (+)</option>
                <option value="sub" {% if operation == 'sub' %}selected{% endif %}>Вычитание (−)</option>
                <option value="mul" {% if operation == 'mul' %}selected{% endif %}>Умножение (×)</option>
                <option value="div" {% if operation == 'div' %}selected{% endif %}>Деление (÷)</option>
            </select>

            <label for="num2">Второе число</label>
            <input type="text" id="num2" name="num2" value="{{ num2 }}" placeholder="Например, 3" required>

            <button type="submit">Вычислить</button>
        </form>

        {% if result is not none %}
            <div class="result">Результат: {{ result }}</div>
        {% endif %}
    </div>
</body>
</html>
